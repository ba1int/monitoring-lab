define command {
    command_name    check-host-ssh
    command_line    $USER1$/check_ssh -H "$HOSTADDRESS$" -p 22 -t 8
}

define command {
    command_name    check-ssh-service
    command_line    $USER1$/check_ssh -H "$HOSTADDRESS$" -p 22 -t 8
}

define command {
    command_name    check-lab-middleware-by-ssh
    command_line    $USER1$/check_by_ssh -H "$HOSTADDRESS$" -p 22 -l operator -i "$USER2$" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -t 8 -C "/usr/local/libexec/check_lab_middleware"
}

# Nagios requires notification command references even when notifications are
# disabled. These explicit no-ops keep the lab free from accidental messages.
define command {
    command_name    notify-host-noop
    command_line    /bin/true
}

define command {
    command_name    notify-service-noop
    command_line    /bin/true
}
