define contact {
    contact_name                    nagiosadmin
    alias                           Monitoring Lab Administrator
    host_notifications_enabled      0
    service_notifications_enabled   0
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       n
    service_notification_options    n
    host_notification_commands      notify-host-noop
    service_notification_commands   notify-service-noop
}

define contactgroup {
    contactgroup_name   lab-admins
    alias               Monitoring Lab Administrators
    members             nagiosadmin
}
