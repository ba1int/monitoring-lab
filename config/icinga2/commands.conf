object CheckCommand "lab-middleware-via-ssh" {
  command = [ "/usr/local/libexec/check_by_ssh_lab" ]

  // The wrapper deliberately owns SSH policy and key handling. Positional
  // arguments keep the remote command a single value instead of shell text.
  arguments = {
    "host" = {
      value = "$address$"
      skip_key = true
      order = 1
      required = true
    }
    "user" = {
      value = "$lab_ssh_user$"
      skip_key = true
      order = 2
      required = true
    }
    "remote-command" = {
      value = "$lab_remote_command$"
      skip_key = true
      order = 3
      required = true
    }
    "timeout" = {
      value = "$lab_ssh_timeout$"
      skip_key = true
      order = 4
      required = true
    }
  }

  timeout = 8s
}
